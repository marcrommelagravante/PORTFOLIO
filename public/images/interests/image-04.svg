<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" fill="none">
  <defs>
    <linearGradient id="wall4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E7E2D6"/>
      <stop offset="100%" stop-color="#C5BFB0"/>
    </linearGradient>
  </defs>
  <!-- Full Bleed Architectural Wall -->
  <rect width="960" height="680" fill="url(#wall4)"/>
  <!-- Dark Window Cutout -->
  <rect x="220" y="110" width="340" height="460" rx="4" fill="#201F1C"/>
  <rect x="235" y="125" width="150" height="210" fill="#2B2A26"/>
  <rect x="395" y="125" width="150" height="210" fill="#262521"/>
  <rect x="235" y="345" width="150" height="210" fill="#1C1B18"/>
  <rect x="395" y="345" width="150" height="210" fill="#2E2D28"/>
  <!-- Dramatic Slanted Shadow Casting across Wall -->
  <polygon points="560,110 960,340 960,680 430,680" fill="#1A1916" opacity="0.6"/>
  <!-- Minimalist Thin Rod Silhouette in Sunlight -->
  <line x1="680" y1="0" x2="680" y2="680" stroke="#B3AC9D" stroke-width="2"/>
  <line x1="780" y1="0" x2="780" y2="680" stroke="#B3AC9D" stroke-width="1.5"/>
</svg>
