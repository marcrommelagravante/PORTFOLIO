      <stop offset="0%" stop-color="#3C434C"/>
      <stop offset="45%" stop-color="#7B8794"/>
      <stop offset="65%" stop-color="#C2B7A3"/>
      <stop offset="100%" stop-color="#E8DBC5"/>
