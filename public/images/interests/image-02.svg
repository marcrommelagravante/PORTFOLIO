      <stop offset="0%" stop-color="#EBE7DC"/>
      <stop offset="45%" stop-color="#DAD4C5"/>
      <stop offset="100%" stop-color="#C2BCAF"/>
    </linearGradient>
    <linearGradient id="mtn2a" x1="0" y1="0" x2="1" y2="1">
